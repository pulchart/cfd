# Scenarios for run.py.
#
# fragments: AmigaDOS steps a scenario lists by name; they run from
# S:Startup-Sequence after the driver set is in place. {wait} is the automount
# wait from the config, {copy} the command that moves files to and from
# OUT: (dd on AROS and ApolloOS). scenarios.py adds mix_io (every CFn: of a mixed card:
# read the payload, write a file, read it back) and rdb_io (format, write and
# read every RDB partition) and rdb_after (read the written files back).
#
# scenarios:
#   doc        one line for --list and the report
#   prefs      cfd.prefs keys on top of the base set in scenarios.py
#   mountlist  a CF0 mountlist written to OUT: under this name
#   layout     card layout: mbr (default, one FAT16 partition), rdb, mbr_mix, gpt_mix
#   steps      fragment names, in order
#   checks     the check set in scenarios.py
#
# planned: scenarios not implemented yet; tests/INVENTORY.md lists them.
#   doc        what it is to check
#   needs      what is missing for it

---
fragments:
  start: |  # opening the unit starts the driver
    OUT:CFInfo >NIL:
    Wait {wait}
  snap: |
    Info >OUT:info0.txt
    lsptres V >OUT:pt0.txt
  read: |
    List CF0: >OUT:list0.txt
    {copy} CF0:payload.bin OUT:got0.bin
  write: |  # fat95 flushes lazily
    {copy} OUT:up.bin CF0:up.bin
    Wait 5
  mount_cf0: |  # the handler starts on first use
    Mount CF0: FROM OUT:CF0 >OUT:mount.txt
  mount_cfx: |
    Mount CFX: FROM OUT:CFX >OUT:mount.txt
    List CFX: >OUT:listx.txt
  devinfo: |
    OUT:devinfo CF0: >OUT:devinfo.txt
  swap: |
    OUT:cardout
    Wait 3
    OUT:cardin
    Wait {wait}
  card_out: |  # the card leaves the slot and stays out until card_in
    OUT:cardout
    Wait 3
  card_in: |
    OUT:cardin
    Wait {wait}
  snap_out: |  # while the card is out
    Info >OUT:info2.txt
    lsptres V >OUT:pt2.txt
  snap_out2: |
    Info >OUT:info3.txt
    lsptres V >OUT:pt3.txt
  mount_cfx_only: |  # the handler starts on first use, here before the card arrives
    Mount CFX: FROM OUT:CFX >OUT:mount.txt
    List CFX: >NIL:
    Wait 2
  list_cfx: |
    List CFX: >OUT:listx.txt
  snap_after_cfx: |
    Info >OUT:info1.txt
    lsptres V >OUT:pt1.txt
    {copy} CFX:payload.bin OUT:got1.bin
  snap_after2: |
    Info >OUT:info4.txt
    lsptres V >OUT:pt4.txt
    {copy} CF0:payload.bin OUT:got4.bin
  snap_after: |
    Info >OUT:info1.txt
    lsptres V >OUT:pt1.txt
    List CF0: >OUT:list1.txt
    {copy} CF0:payload.bin OUT:got1.bin
  fsres: |
    lsfsres >OUT:fsres.txt
  hold_open: |  # tools/holdfile.c keeps the payload open until OUT:go
    Run >NIL: OUT:holdfile >OUT:hold.txt CF0:payload.bin OUT:held.bin OUT:go
    Wait 2
  hold_release: |
    Echo "go" >OUT:go
    Wait 3

scenarios:
  automount:
    doc: "default cfd.prefs: CF0 mounts on insert, reads and writes"
    steps: [start, snap, read, write]
    checks: automount
  automount_off:
    doc: "AUTOMOUNT 0: the card is identified, nothing mounts"
    prefs: {AUTOMOUNT: "0"}
    steps: [start, snap]
    checks: automount_off
  static:
    doc: AUTOMOUNT 0 and a hand mount of CF0 from a mountlist
    prefs: {AUTOMOUNT: "0"}
    mountlist: CF0
    steps: [start, mount_cf0, read, snap]
    checks: static
  static_in_use:
    doc: "automounted CF0 plus a hand mount of the same partition: refused"
    mountlist: CFX
    steps: [start, mount_cfx, snap, read]
    checks: static_in_use
  static_mount_used:
    doc: "MOUNT_USED 1: the hand mount of an automounted partition is let through"
    prefs: {MOUNT_USED: "1"}
    mountlist: CFX
    steps: [start, mount_cfx, snap]
    checks: static_mount_used
  handler_params:
    doc: STACK_FAT, PRI_FAT and DOSTYPE_FAT reach the mounted node
    prefs: {STACK_FAT: "16384", PRI_FAT: "3", DOSTYPE_FAT: "0x46415401"}
    steps: [start, snap, devinfo]
    checks: handler_params
  swap:
    doc: "the card leaves and comes back: removal seen, remounted, data intact"
    steps: [start, snap, swap, snap_after, write]
    checks: swap
  swap_open:
    doc: "a file held open across the swap reads back through the same handle"
    steps: [start, snap, hold_open, swap, snap_after, hold_release, write]
    checks: swap_open
  late_insert:
    doc: "the driver starts with an empty slot and the RDB card arrives later: published, formatted, written and read"
    layout: rdb
    steps: [card_out, start, snap_out, card_in, snap, fsres, rdb_io]
    checks: late_insert
  swap_keep:
    doc: "UNMOUNT NONE: CF0 kept and marked absent while the card is out, its handler serves again on insert, a file held open reads back"
    prefs: {UNMOUNT: NONE}
    steps: [start, snap, hold_open, card_out, snap_out, card_in, snap_after, hold_release, write]
    checks: swap_keep
  swap_in_use:
    doc: "default UNMOUNT with a file open: CF0 kept on removal; the next removal without it unmounts CF0"
    steps: [start, snap, hold_open, card_out, snap_out, card_in, snap_after, hold_release, card_out, snap_out2, card_in, snap_after2]
    checks: swap_in_use
  swap_static_default:
    doc: "default UNMOUNT_STATIC: a hand mount serves the card, is torn down on removal and the card comes back as CF0"
    mountlist: CFX
    steps: [card_out, start, mount_cfx_only, card_in, snap, list_cfx, card_out, snap_out, card_in, snap_after]
    checks: swap_static_default
  swap_static_keep:
    doc: "UNMOUNT_STATIC 0: a hand mount survives the removal, marked absent, and serves again on insert"
    prefs: {UNMOUNT_STATIC: "0"}
    mountlist: CFX
    steps: [card_out, start, mount_cfx_only, card_in, snap, list_cfx, card_out, snap_out, card_in, snap_after_cfx]
    checks: swap_static_keep
  rdb:
    doc: "RDB with FFS and PFS3: PFS3 from the RDB, both formatted, written and read"
    layout: rdb
    steps: [start, snap, fsres, rdb_io]
    checks: rdb
  rdb_swap:
    doc: "the RDB card leaves and comes back: FFS and PFS3 remount, written files read back"
    layout: rdb
    steps: [start, snap, fsres, rdb_io, swap, rdb_after]
    checks: rdb_swap
  swap_partial:
    doc: "UNMOUNT FFS on an RDB card: the FFS partition unmounted, PFS3 kept and marked absent, both read back after the swap"
    layout: rdb
    prefs: {UNMOUNT: FFS}
    steps: [start, snap, fsres, rdb_io, card_out, snap_out, card_in, rdb_after]
    checks: swap_partial
  mbr_mix:
    doc: "MBR, a primary and logical partitions: FAT12, FAT16, FAT32, NTFS, exFAT"
    layout: mbr_mix
    steps: [start, snap, mix_io]
    checks: mbr_mix
  gpt_mix:
    doc: "GPT basic data partitions: FAT12, FAT16, FAT32, NTFS, exFAT"
    layout: gpt_mix
    steps: [start, snap, mix_io]
    checks: gpt_mix

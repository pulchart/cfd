# Settings of run.py. os names the OS profiles, the image brings the OS. A
# relative path starts at the repository root. The driver, ptable.library,
# lsptres and CFInfo come from this repository's dist/; fat95, lsfsres and
# pfs3 from their releases unless set here, e.g. fat95: ../fat95/dist/l/68020/fat95.
# With GH_TOKEN set, fat95 comes from the newest fat95 CI run.
---
os:
  # the local AmigaOS images as an A1200 and as an A600 with the 68000 builds
  "3.2.3-a1200":
    model: A1200
    skip:
      rdb_in_use: FFS 47 accepts ACTION_DIE with a file open, so the open handle dies with it
      rdb_release_out: FFS 47 accepts ACTION_DIE with a file open, so the open handle dies with it
  "3.1-a1200":
    model: A1200
    skip:
      swap_partial: FFS 40 refuses ACTION_DIE (209), so the FFS partition cannot be unmounted
      rdb_in_use: FFS 40 refuses ACTION_DIE (209), so the FFS partition cannot be unmounted
      rdb_release_out: FFS 40 refuses ACTION_DIE (209), so the FFS partition cannot be unmounted
  "3.2.3-a600":
    model: A600
    cpu: "68000"
    tier: "68000"
    skip:
      rdb_in_use: FFS 47 accepts ACTION_DIE with a file open, so the open handle dies with it
      rdb_release_out: FFS 47 accepts ACTION_DIE with a file open, so the open handle dies with it
  "3.1-a600":
    model: A600
    cpu: "68000"
    tier: "68000"
    skip:
      swap_partial: FFS 40 refuses ACTION_DIE (209), so the FFS partition cannot be unmounted
      rdb_in_use: FFS 40 refuses ACTION_DIE (209), so the FFS partition cannot be unmounted
      rdb_release_out: FFS 40 refuses ACTION_DIE (209), so the FFS partition cannot be unmounted
  aros:
    setpatch: false
    cpu: 68040-NOMMU
    copy: dd
    prefs: {STACK_FAT: "65536"}
  apolloos:
    setpatch: false
    cpu: 68040-NOMMU
    copy: dd
    prefs: {STACK_FAT: "65536"}
